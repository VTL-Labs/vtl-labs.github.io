<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
    <title>Home</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="HOME.html">Home</a>
    </nav>
    <main>
      <div class="terminal-panel">
        <h1 class="terminal-text">Willkommen auf der Homepage!</h1>
        <p class="terminal-text">Dies ist die Startseite der Website.</p>
      </div>

      <div class="terminal-window">
        <div class="terminal-header">
          <span class="terminal-title">Terminal</span>
        </div>
        <div class="terminal-body">
          <p class="terminal-text">Willkommen im Terminal!</p>
          <p class="terminal-prompt">Hier können Sie Befehle eingeben.</p>
          <form class="terminal-command-form" id="terminal-form">
            <label class="terminal-muted" for="terminal-input">Befehl</label>
            <div class="terminal-command-row">
              <input
                id="terminal-input"
                name="command"
                type="text"
                placeholder="open stonksSim"
                autocomplete="off"
                spellcheck="false"
                required
              />
              <button class="terminal-button" type="submit">Ausführen</button>
            </div>
          </form>
          <p class="terminal-output" id="terminal-output" role="status" aria-live="polite"></p>
        </div>
      </div>
    </main>
    <script src="../JS/script.js" defer></script>
  </body>
</html>
